server:
  port: 9090
spring:
  servlet:
    multipart:
      max-file-size: ${SCHEMAFORGE_UPLOAD_MAX_FILE_SIZE:500MB}
      max-request-size: ${SCHEMAFORGE_UPLOAD_MAX_REQUEST_SIZE:520MB}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

schemaforge:
  # Glossary is enabled by default for REST, ZIP generation and governance UI.
  # Set SCHEMAFORGE_GLOSSARY_ENABLED=false to opt out explicitly.
  # Startup can seed missing baseline CANDIDATE terms in the local H2 file;
  # DRY_RUN prevents automatic registration of newly discovered terms.
  glossary:
    enabled: ${SCHEMAFORGE_GLOSSARY_ENABLED:true}
    database-path: ${SCHEMAFORGE_GLOSSARY_DATABASE_PATH:./data/schemaforge-glossary}
    # When glossary is enabled, create H2 on disk and import the embedded
    # 01_Atomic_Terms worksheet as CANDIDATE; safe to repeat on every startup.
    seed-on-startup: ${SCHEMAFORGE_GLOSSARY_SEED_ON_STARTUP:true}
    admin-key: ${SCHEMAFORGE_GLOSSARY_ADMIN_KEY:}
    # V4.14.5-P1/P2: zero H2 candidate writes unless explicitly AUTO_CANDIDATE.
    # DRY_RUN only classifies/records counts in reports/glossary/summary.json.
    candidate-registration:
      mode: ${SCHEMAFORGE_GLOSSARY_CANDIDATE_REGISTRATION_MODE:DRY_RUN}

  numeric-mapping:
    # SAFE preserves NUMBER as NUMERIC/DECIMAL. OPTIMIZED narrows scale-zero values losslessly.
    strategy: ${SCHEMAFORGE_NUMERIC_MAPPING_STRATEGY:SAFE}

  # Enterprise Architect XMI files often do not contain a physical schema.
  # Override with SCHEMAFORGE_EA_DEFAULT_SCHEMA or edit this value.
  ea:
    default-schema: ${SCHEMAFORGE_EA_DEFAULT_SCHEMA:COL}
    # Strict/no-guess default: PK does not imply identity. Enable only for legacy compatibility.
    primary-key-as-identity: ${SCHEMAFORGE_EA_PRIMARY_KEY_AS_IDENTITY:false}

  standards:
    audit:
      enabled: true
      columns:
        - name: CREATED_BY
          dataType: VARCHAR2(50)
          nullable: false
          comment: "Creation user"
          persianName: "کاربر ایجادکننده"
        - name: CREATED_DATE
          dataType: TIMESTAMP
          nullable: false
          comment: "Creation timestamp"
          persianName: "تاریخ و زمان ایجاد"
        - name: LAST_MODIFIED_BY
          dataType: VARCHAR2(50)
          nullable: false
          comment: "Last modification user"
          persianName: "کاربر آخرین تغییر"
        - name: LAST_MODIFIED_DATE
          dataType: TIMESTAMP
          nullable: false
          comment: "Last modification timestamp"
          persianName: "تاریخ و زمان آخرین تغییر"

    # GRANT generation is opt-in. SchemaForge never invents database users/roles.
    # Add only principals that are provisioned by the target environment/DBA.
    grants: []
    # Example:
    # grants:
    #   - grantee: APP_DEVELOPER
    #     privileges: [SELECT, INSERT, UPDATE, DELETE]
    #   - grantee: APP_READONLY
    #     privileges: [SELECT]

  naming:
    # Naming validation is DBMS-independent and runs once on the canonical model.
    # Supported values: SINGULAR, PLURAL, OFF.
    table-convention: ${SCHEMAFORGE_TABLE_NAMING_CONVENTION:OFF}
    plural-column-components-enabled: true

  spell-check:
    # Offline Hunspell lexical check by default; external HTTP is opt-in only.
    enabled: ${SCHEMAFORGE_SPELL_CHECK_ENABLED:true}
    provider: ${SCHEMAFORGE_SPELL_CHECK_PROVIDER:OFFLINE}
    endpoint: https://api.languagetool.org/v2/check
    language: en-US
    connect-timeout: 3s
    request-timeout: 5s
    maximum-suggestions: 3
    fail-open: true
    technical-terms:
      - MEPS
      - BEHSAZAN
      - MELLAT
      - BNCP
      - SUBLEDGER
      - TXN
      - RECON
      - PAYINST
      - ENR
      - RECALC
      # Spell-check exclusions are not Glossary approvals.
      - IDEMPOTENCY
      - JSON
      - IBAN
      - GRANTOR
      - NOSTRO
      - VOSTRO
      - KYC
      - AML
      - CIF
      - UUID
      - SQL

  metadata:
    oracle:
      enabled: true
      url: jdbc:oracle:thin:@//10.1.60.51:1522/FREEPDB1
      username: SYSTEM
      password: Oracle123
      driver-class-name: oracle.jdbc.OracleDriver

    postgresql:
      enabled: true
      url: jdbc:postgresql://10.1.60.51:5432/postgres
      username: postgres
      password: postgres@123456
      driver-class-name: org.postgresql.Driver

    # Disabled by default because IBM JCC is not bundled with the project.
    db2zos:
      enabled: false
      url: jdbc:db2://172.16.16.92:478/DEV
      username: ${SCHEMAFORGE_METADATA_DB2ZOS_USERNAME:}
      password: ${SCHEMAFORGE_METADATA_DB2ZOS_PASSWORD:}
      driver-class-name: com.ibm.db2.jcc.DB2Driver

    # IBM JCC is opt-in via the Maven db2luw-live profile. Keep runtime metadata
    # disabled by default so normal application startup does not require JCC.
    # Enable explicitly with SCHEMAFORGE_METADATA_DB2LUW_ENABLED=true together
    # with -Pdb2luw-live when live Db2 LUW metadata access is required.
    db2luw:
      enabled: ${SCHEMAFORGE_METADATA_DB2LUW_ENABLED:false}
      url: jdbc:db2://localhost:50000/SFORGE
      username: db2inst1
      password: Schemaforge123
      driver-class-name: com.ibm.db2.jcc.DB2Driver

    sqlserver:
      enabled: true
      url: jdbc:sqlserver://localhost:1433;databaseName=master;encrypt=true;trustServerCertificate=true
      username: sa
      password: sa@123456
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    # MySQL metadata is enabled explicitly for migration/live comparison.
    mysql:
      enabled: true
      url: jdbc:mysql://localhost:3307/?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
      username: root
      password: mysql123
      driver-class-name: com.mysql.cj.jdbc.Driver
    # MariaDB metadata is introduced in M5 and remains opt-in until the live gate.
    mariadb:
      enabled: ${SCHEMAFORGE_METADATA_MARIADB_ENABLED:false}
      url: ${SCHEMAFORGE_METADATA_MARIADB_URL:jdbc:mariadb://localhost:3308/}
      username: ${SCHEMAFORGE_METADATA_MARIADB_USERNAME:root}
      password: ${SCHEMAFORGE_METADATA_MARIADB_PASSWORD:}
      driver-class-name: org.mariadb.jdbc.Driver
