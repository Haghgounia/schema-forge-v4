# SchemaForge operator-only Linux example, accessed via SSH port forwarding.
# DO NOT change listen to 0.0.0.0 / public IP without an authenticated gateway
# and a review of DatabaseConnectionController's loopback-only security policy.
server {
    listen 127.0.0.1:8080;
    server_name localhost 127.0.0.1;

    root /opt/schemaforge/ui/dist;
    index index.html;
    client_max_body_size 520m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /swagger-ui.html {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $http_host;
    }
    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $http_host;
    }
    location /v3/api-docs {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $http_host;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
